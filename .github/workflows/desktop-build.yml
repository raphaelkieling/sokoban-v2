name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Package Windows and macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build desktop packages
        run: ./scripts/build-desktop.sh all

      - name: Upload downloadable builds
        uses: actions/upload-artifact@v4
        with:
          name: sokoban-desktop-builds
          path: dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: sokoban-desktop-builds
          path: dist/desktop

      - name: Create release with generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/desktop/*.zip \
            --title "Sokoban v2 $GITHUB_REF_NAME" \
            --generate-notes
